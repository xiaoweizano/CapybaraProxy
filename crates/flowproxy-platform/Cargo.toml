[package]
name = "flowproxy-platform"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"

[dependencies]
flowproxy-contracts = { path = "../flowproxy-contracts" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Networking_WinInet",
  "Win32_Security",
  "Win32_System_Registry",
  "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3.23.0"
