[package]
name = "flowproxy-mihomo-manager"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"

[dependencies]
base64 = "0.22.1"
flowproxy-contracts = { path = "../flowproxy-contracts" }
# Subscription downloads follow the same route as the user's proxy client.
# reqwest's own `system-proxy` feature is not usable here: its dependency
# graph pulls a macOS-only crate that this offline build does not vendor, so
# `system_proxy.rs` reads the Windows proxy settings directly.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls", "http2", "charset"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
url = "2.5.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry"] }

[dev-dependencies]
tempfile = "3.23.0"

