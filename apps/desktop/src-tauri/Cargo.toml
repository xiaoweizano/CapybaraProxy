[package]
name = "flowproxy-desktop"
version = "0.1.0"
description = "FlowProxy desktop client"
authors = ["FlowProxy"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "flowproxy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
flowproxy-contracts = { path = "../../../crates/flowproxy-contracts" }
flowproxy-mihomo-manager = { path = "../../../crates/mihomo-manager" }
flowproxy-platform = { path = "../../../crates/flowproxy-platform" }
flowproxy-runtime = { path = "../../../crates/flowproxy-runtime" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
tauri = { version = "2.12.5", features = ["tray-icon"] }

[dev-dependencies]
tempfile = "3.23.0"
